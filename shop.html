<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Ontdek alle voetbalshirts van Footy4theworld: retro klassiekers en het nieuwe seizoen." />
<title>Alle shirts — Footy4theworld</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="js/products.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body data-page="shop">
  <header id="site-header"></header>

  <main class="container">
    <section class="page-head">
      <p class="eyebrow">Shop</p>
      <h1>Alle <em>shirts</em></h1>
    </section>
    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter">
        <button class="filter-chip" data-filter="alle" aria-pressed="true">Alle</button>
        <button class="filter-chip" data-filter="nieuw" aria-pressed="false">Nieuw seizoen</button>
        <button class="filter-chip" data-filter="retro" aria-pressed="false">Retro</button>
        <button class="filter-chip" data-filter="premier-league" aria-pressed="false">Premier League</button>
        <button class="filter-chip" data-filter="serie-a" aria-pressed="false">Serie A</button>
        <button class="filter-chip" data-filter="laliga" aria-pressed="false">LaLiga</button>
        <button class="filter-chip" data-filter="ligue-1" aria-pressed="false">Ligue 1</button>
      </div>
      <label class="sort"><span class="visually-hidden">Sorteer</span>
        <select id="sortSelect">
          <option value="standaard">Uitgelicht</option>
          <option value="seizoen">Nieuwste seizoen</option>
          <option value="prijs-op">Prijs oplopend</option>
          <option value="prijs-af">Prijs aflopend</option>
        </select>
      </label>
    </div>
    <p class="eyebrow" id="shopCount" style="margin-bottom:24px"></p>
    <div class="product-grid" id="shopGrid"></div>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
